<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fuse Time-Current Curves</title>
  https://cdn.plot.ly/plotly-latest.min.js</script>
  <style>
    .wrap { position: relative; width: 90%; height: 80vh; margin: 0 auto; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Fuse Time-Current Curves</h2>

  <div style="text-align:center; margin:20px;">
    <label for="fuseDropdown">Select a Fuse Type:</label>
    <select id="fuseDropdown"></select>
  </div>

  <div class="wrap">
    <div id="chart" style="width:100%;height:100%;"></div>
  </div>

  <script>
    const PLOT_CONFIG = {
      responsive: true,
      displayModeBar: true,
      scrollZoom: false,
      doubleClick: false,
    };

    async function loadData() {
      const response = await fetch("tcc_restructured.json");
      const data = await response.json();
      window.fuseData = data;

      const dropdown = document.getElementById("fuseDropdown");

      function populateDropdown(fuseNames = Object.keys(data)) {
        dropdown.innerHTML = "";
        fuseNames.forEach(fuse => {
          const opt = document.createElement("option");
          opt.value = fuse;
          opt.text = fuse;
          dropdown.appendChild(opt);
        });
        if (fuseNames.length > 0) {
          plotFuse(fuseNames[0], data);
        }
      }

      populateDropdown();

      dropdown.addEventListener("change", () => plotFuse(dropdown.value, data));
    }

    function prepSeries(xs, ys) {
      const pairs = xs.map((x, i) => [Number(x), Number(ys[i])])
                      .filter(p => isFinite(p[0]) && p[0] > 0 && isFinite(p[1]) && p[1] > 0)
                      .sort((a,b) => a[0]-b[0]);
      const X = pairs.map(p => p[0]);
      const Y = pairs.map(p => p[1]);
      return { X, Y };
    }

    function plotFuse(fuseName, data) {
      const fuseCurves = data[fuseName];
      const traces = [];

      Object.entries(fuseCurves).forEach(([rating, timeCurrentMap]) => {
        const rawY = Object.keys(timeCurrentMap);   // time values
        const rawX = Object.values(timeCurrentMap); // current values

        const { X, Y } = prepSeries(rawX, rawY);

        traces.push({
          x: X,
          y: Y,
          mode: "lines",
          type: "scatter",
          name: `${rating}`,
          line: { width: 2 }
        });
      });

      const layout = {
        title: `Time-Current Curves: ${fuseName}`,
        hovermode: "closest",
        xaxis: {
          title: "Current (A)",
          type: "log"
        },
        yaxis: {
          title: "Time (s)",
          type: "log"
        },
        margin: { l: 70, r: 20, t: 60, b: 60 }
      };

      Plotly.newPlot("chart", traces, layout, PLOT_CONFIG);
    }

    loadData();
  </script>
</body>
</html>
