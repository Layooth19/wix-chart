<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fuse Time-Current Curves</title>
  https://cdn.plot.ly/plotly-latest.min.js
  <style>
    .wrap { position: relative; width: 90%; height: 80vh; margin: 0 auto; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Fuse Time-Current Curves</h2>

  <div style="text-align:center; margin:20px;">
    <label for="fuseDropdown">Select Fuse Type:</label>
    <select id="fuseDropdown"></select>

    <label for="ratingDropdown" style="margin-left:20px;">Select Current Rating:</label>
    <select id="ratingDropdown"></select>
  </div>

  <div class="wrap">
    <div id="chart" style="width:100%;height:100%;"></div>
  </div>

  <script>
    const PLOT_CONFIG = {
      responsive: true,
      displayModeBar: true,
      scrollZoom: false,
      doubleClick: false,
    };

    async function loadData() {
      const response = await fetch("tcc_restructured.json");
      const data = await response.json();
      window.fuseData = data;

      const fuseDropdown = document.getElementById("fuseDropdown");
      const ratingDropdown = document.getElementById("ratingDropdown");

      function populateFuseDropdown() {
        fuseDropdown.innerHTML = "";
        Object.keys(data).forEach(fuse => {
          const opt = document.createElement("option");
          opt.value = fuse;
          opt.text = fuse;
          fuseDropdown.appendChild(opt);
        });
        populateRatingDropdown(fuseDropdown.value);
      }

      function populateRatingDropdown(fuseName) {
        ratingDropdown.innerHTML = "";
        const ratings = Object.keys(data[fuseName] || {});
        ratings.forEach(rating => {
          const opt = document.createElement("option");
          opt.value = rating;
          opt.text = rating;
          ratingDropdown.appendChild(opt);
        });
        if (ratings.length > 0) {
          plotFuse(fuseName, ratings[0], data);
        }
      }

      fuseDropdown.addEventListener("change", () => {
        populateRatingDropdown(fuseDropdown.value);
      });

      ratingDropdown.addEventListener("change", () => {
        plotFuse(fuseDropdown.value, ratingDropdown.value, data);
      });

      populateFuseDropdown();
    }

    function prepSeries(xs, ys) {
      const pairs = xs.map((x, i) => [parseFloat(x), parseFloat(ys[i])])
                      .filter(p => isFinite(p[0]) && p[0] > 0 && isFinite(p[1]) && p[1] > 0)
                      .sort((a,b) => a[0]-b[0]);
      const X = pairs.map(p => p[0]);
      const Y = pairs.map(p => p[1]);
      return { X, Y };
    }

    function plotFuse(fuseName, rating, data) {
      const timeCurrentMap = data[fuseName][rating];
      const rawY = Object.keys(timeCurrentMap);   // time values
      const rawX = Object.values(timeCurrentMap); // current values

      const { X, Y } = prepSeries(rawX, rawY);

      if (X.length === 0 || Y.length === 0) {
        document.getElementById("chart").innerHTML = "<p style='text-align:center;'>No valid data to display.</p>";
        return;
      }

      const trace = {
        x: X,
        y: Y,
        mode: "lines+markers",
        type: "scatter",
        name: `${rating}`,
        line: { width: 2 }
      };

      const layout = {
        title: `Time-Current Curve: ${fuseName} (${rating})`,
        hovermode: "closest",
        xaxis: {
          title: "Current (A)",
          type: "log"
        },
        yaxis: {
          title: "Time (s)",
          type: "log"
        },
        margin: { l: 70, r: 20, t: 60, b: 60 }
      };

      Plotly.newPlot("chart", [trace], layout, PLOT_CONFIG);
    }

    loadData();
  </script>
</body>
</html>
